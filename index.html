<h1>tumxcc</h1>
<p>tumxcc 是一個小團隊內部使用的工作階段管理工具。使用者可以選擇連結自己的 Google 帳號，讓工具在完成工作（例如每月報告產出）時，用該帳號寄出通知信。</p>
<h2>使用 Google 帳號做什麼</h2>
<ul>
  <li>只要求 <code>gmail.send</code> 權限：以使用者的名義寄出使用者自己觸發的通知信。</li>
  <li>另外取得帳號的 email（<code>openid</code>、<code>email</code>），用來顯示目前連結的是哪個帳號。</li>
  <li>不讀取信件、不存取雲端硬碟、日曆或其他 Google 資料。</li>
</ul>
<p>詳見 <a href="privacy.html">隱私權政策</a>。</p>
